# Run one pipeline command on demand (for an operator without database access).
name: Operate
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command"
        required: true
        type: choice
        options: [tick, process, reclassify, prices, verify, calendar, eval, diag, taxonomy, status, prebuild]
      minutes:
        description: "Time budget in minutes"
        required: false
        default: "12"
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/finn.ts ${{ github.event.inputs.command }} --minutes ${{ github.event.inputs.minutes }}
