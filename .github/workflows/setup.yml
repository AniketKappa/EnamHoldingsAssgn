# One-time (and re-runnable) setup: schema, symbol master, the demo portfolio,
# 30 days of filings, a year of prices, then the first processing pass.
name: Setup
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of filings to backfill"
        required: false
        default: "30"
  push:
    branches: [main]
    paths: ["db/schema.sql", "data/portfolio.json"]
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add the DATABASE_URL repository secret first." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/finn.ts probe
      - run: npx tsx scripts/finn.ts migrate
      - run: npx tsx scripts/finn.ts seed
      - run: npx tsx scripts/finn.ts symbols
        continue-on-error: true
      - run: npx tsx scripts/finn.ts backfill --days "${{ github.event.inputs.days || '30' }}" --minutes 20
      - run: npx tsx scripts/finn.ts process --minutes 20
      - run: npx tsx scripts/finn.ts calendar
        continue-on-error: true
      - run: npx tsx scripts/finn.ts taxonomy
      - run: npx tsx scripts/finn.ts status
